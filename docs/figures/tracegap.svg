<svg viewBox="0 0 560 264" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="0" y="0" width="560" height="264" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbb"/></marker></defs><text x="6" y="14" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start" letter-spacing="1.2">THE EVENT</text><text x="6" y="26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" fill="#777777" text-anchor="start">what actually happened</text><text x="554" y="14" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="end" letter-spacing="1.2">THE RECORD</text><text x="554" y="26" font-family="Helvetica,Arial,sans-serif" font-size="8.6" fill="#777777" text-anchor="end">what the till writes</text><line x1="300" y1="34" x2="300" y2="214" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/><text x="300" y="228" font-family="Helvetica,Arial,sans-serif" font-size="8.6" fill="#777777" text-anchor="middle">discarded at capture</text><text x="6" y="54" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#777777" text-anchor="start">the person and why they came</text><line x1="236" y1="50" x2="292" y2="50" stroke="#bbbbbb" stroke-width="1"/><circle cx="296" cy="50" r="2.5" fill="#c0392b"/><text x="6" y="81" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#777777" text-anchor="start">what they compared it against</text><line x1="236" y1="77" x2="292" y2="77" stroke="#bbbbbb" stroke-width="1"/><circle cx="296" cy="77" r="2.5" fill="#c0392b"/><text x="6" y="108" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#777777" text-anchor="start">where the item sat, and beside what</text><line x1="236" y1="104" x2="292" y2="104" stroke="#bbbbbb" stroke-width="1"/><circle cx="296" cy="104" r="2.5" fill="#c0392b"/><text x="6" y="135" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#777777" text-anchor="start">who was working that hour</text><line x1="236" y1="131" x2="292" y2="131" stroke="#bbbbbb" stroke-width="1"/><circle cx="296" cy="131" r="2.5" fill="#c0392b"/><text x="6" y="162" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#777777" text-anchor="start">the weather, and whether they walked</text><line x1="236" y1="158" x2="292" y2="158" stroke="#bbbbbb" stroke-width="1"/><circle cx="296" cy="158" r="2.5" fill="#c0392b"/><text x="6" y="189" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111111" text-anchor="start">the item, price, quantity</text><line x1="236" y1="185" x2="386.0" y2="185.0" stroke="#3a8a4e" stroke-width="1"/><polygon points="392,185 386.0,188.0 386.0,182.0" fill="#3a8a4e"/><rect x="396" y="174" width="158" height="22" fill="none" stroke="#3a8a4e" stroke-width="1"/><text x="475.0" y="188.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a8a4e" text-anchor="middle">the item</text><text x="6" y="216" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111111" text-anchor="start">the time and the tender</text><line x1="236" y1="212" x2="386.0" y2="212.0" stroke="#3a8a4e" stroke-width="1"/><polygon points="392,212 386.0,215.0 386.0,209.0" fill="#3a8a4e"/><rect x="396" y="201" width="158" height="22" fill="none" stroke="#3a8a4e" stroke-width="1"/><text x="475.0" y="215.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a8a4e" text-anchor="middle">the time and the tender</text><line x1="396" y1="238" x2="554" y2="238" stroke="#bbbbbb" stroke-width="1"/><text x="554" y="254" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="end">every surviving field is one the firm already controls</text></svg>