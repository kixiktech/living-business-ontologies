<svg viewBox="0 0 560 236" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="0" y="0" width="560" height="236" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbb"/></marker></defs><text x="6" y="14" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start" letter-spacing="1.2">WHAT IS MISSING</text><rect x="6" y="36" width="150" height="38" fill="#2f5d8a" fill-opacity="0.16" stroke="#111111" stroke-width="1"/><text x="81.0" y="58.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="middle">an absent instance</text><text x="166" y="52" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111111" text-anchor="start">a row that should exist and does not</text><text x="166" y="65" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">found against the population</text><line x1="432" y1="55" x2="452" y2="55" stroke="#bbbbbb" stroke-width="1" marker-end="url(#af)"/><rect x="456" y="41" width="98" height="28" fill="none" stroke="#bbbbbb" stroke-width="1"/><text x="505.0" y="58.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#bbbbbb" text-anchor="middle">this model</text><rect x="6" y="88" width="150" height="38" fill="#6c95c2" fill-opacity="0.16" stroke="#111111" stroke-width="1"/><text x="81.0" y="110.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="middle">an absent relation</text><text x="166" y="104" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111111" text-anchor="start">two things that should be joined and are not</text><text x="166" y="117" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">found against the schema's obligations</text><line x1="432" y1="107" x2="452" y2="107" stroke="#bbbbbb" stroke-width="1" marker-end="url(#af)"/><rect x="456" y="93" width="98" height="28" fill="none" stroke="#bbbbbb" stroke-width="1"/><text x="505.0" y="110.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#bbbbbb" text-anchor="middle">this model</text><rect x="6" y="140" width="150" height="38" fill="#c9772b" fill-opacity="0.16" stroke="#111111" stroke-width="1"/><text x="81.0" y="162.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="middle">an absent type</text><text x="166" y="156" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111111" text-anchor="start">a whole category this firm has never had</text><text x="166" y="169" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">found against a reference population</text><line x1="432" y1="159" x2="446.0" y2="159.0" stroke="#3a8a4e" stroke-width="1"/><polygon points="452,159 446.0,162.0 446.0,156.0" fill="#3a8a4e"/><rect x="456" y="145" width="98" height="28" fill="none" stroke="#3a8a4e" stroke-width="1"/><text x="505.0" y="162.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a8a4e" text-anchor="middle">many models</text><line x1="6" y1="196" x2="554" y2="196" stroke="#bbbbbb" stroke-width="1"/><text x="6" y="214" font-family="Helvetica,Arial,sans-serif" font-size="9.2" fill="#111111" text-anchor="start">The third is where the value concentrates, and it is the one a single model can never reach:</text><text x="6" y="227" font-family="Helvetica,Arial,sans-serif" font-size="9.2" fill="#111111" text-anchor="start">you cannot see that a firm lacks a revenue line by studying that firm. There is nothing there to study.</text></svg>