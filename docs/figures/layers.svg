<svg viewBox="0 0 560 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="0" y="0" width="560" height="300" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbb"/></marker></defs><rect x="6" y="14" width="300" height="44" fill="#f6ecd6" stroke="#b8862b" stroke-width="1"/><text x="16" y="35.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="600">control</text><text x="16" y="48.0" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="start">decisions, actions, grants, messages</text><text x="318" y="40" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">what may be done, by whom, and what was done</text><rect x="6" y="66" width="300" height="44" fill="#f6ecd6" stroke="#c9772b" stroke-width="1"/><text x="16" y="87.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="600">meaning</text><text x="16" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="start">definitions, identity, evidence, competency questions</text><text x="318" y="92" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">what a number means and whether it can be answered</text><rect x="6" y="118" width="300" height="44" fill="#e3ecf7" stroke="#6c95c2" stroke-width="1"/><text x="16" y="139.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="600">extension</text><text x="16" y="152.0" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="start">per industry: jobs and crews; routes and terms</text><text x="318" y="144" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">admitted only where a named question requires it</text><rect x="6" y="170" width="300" height="44" fill="#e3ecf7" stroke="#2f5d8a" stroke-width="1"/><text x="16" y="191.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="600">core</text><text x="16" y="204.0" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="start">party, person, location, product, order, invoice, payment</text><text x="318" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">the exchange structure of any firm</text><rect x="6" y="222" width="300" height="44" fill="#ececec" stroke="#6b6b6b" stroke-width="1"/><text x="16" y="243.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="start" font-weight="600">store</text><text x="16" y="256.0" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#777777" text-anchor="start">assertions under two clocks</text><text x="318" y="248" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#777777" text-anchor="start">the only thing that holds facts</text><text x="6" y="290" font-family="Helvetica,Arial,sans-serif" font-size="8.8" fill="#111111" text-anchor="start">agent tools read every layer; writes enter through the control layer only</text></svg>